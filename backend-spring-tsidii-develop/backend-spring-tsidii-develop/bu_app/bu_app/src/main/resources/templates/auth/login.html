<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/admin/login.css}">

</head>
<body>

<div class="container">
    <div class="login-box">
        <h2>¿Listo para entrenar?</h2>
        <p>Inicia sesión en tu cuenta</p>

        <div th:if="${param.error}" class="alert error">
            Correo o contraseña incorrectos
        </div>

        <div th:if="${param.logout}" class="alert success">
            Has cerrado sesión correctamente
        </div>

        <form th:action="@{/mvc/auth/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="input-group">
                <label for="username">Correo</label>
                <input type="text" id="username" name="username" placeholder="ej: admin@test.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn">Ingresar</button>
        </form>
    </div>
</div>

</body>
</html>
