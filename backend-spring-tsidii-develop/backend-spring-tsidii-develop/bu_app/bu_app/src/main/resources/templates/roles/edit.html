<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/form.css}">
    <title>Editar Rol</title>
</head>

<body>
    <main class="admin-form-page">
        <section class="admin-form-card">
            <div class="admin-form-header">
                <h2>Editar rol</h2>
                <a th:href="@{/roles}">Volver al listado</a>
            </div>

            <p class="admin-form-error" th:if="${error}" th:text="${error}">Mensaje de error</p>

            <form class="admin-form" th:action="@{/roles/edit}" th:object="${role}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{id}">

                <div class="admin-form__field">
                    <label for="type">Tipo de rol:</label>
                    <input type="text" id="type" th:field="*{type}" maxlength="100" required>
                </div>

                <div class="admin-form__field">
                    <label>Permisos:</label>
                    <div class="admin-form__checkbox-grid">
                        <label class="admin-form__checkbox-item" th:each="permission : ${permissions}">
                            <input type="checkbox" name="permissionIds" th:value="${permission.id}"
                                th:checked="${selectedPermissionIds.contains(permission.id)}">
                            <span th:text="${permission.name}">READ_USER</span>
                        </label>
                    </div>
                </div>

                <div class="admin-form__actions">
                    <button type="submit">Guardar cambios</button>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
