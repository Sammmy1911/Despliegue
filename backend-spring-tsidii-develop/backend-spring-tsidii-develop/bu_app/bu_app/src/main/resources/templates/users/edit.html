<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/form.css}">
    <title>Editar Usuario</title>
</head>

<body>
    <main class="admin-form-page">
        <section class="admin-form-card">
            <div class="admin-form-header">
                <h2>Editar usuario</h2>
                <a th:href="@{/users}">Volver al listado</a>
            </div>

            <p class="admin-form-error" th:if="${error}" th:text="${error}">Mensaje de error</p>

            <form class="admin-form" th:action="@{/users/edit}" th:object="${user}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{code}">

            <div class="admin-form__field">
                <label for="name">Nombre:</label>
                <input type="text" id="name" th:field="*{name}" maxlength="100" required>
            </div>

            <div class="admin-form__field">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" th:field="*{email}" maxlength="100" required>
            </div>

            <div class="admin-form__field">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" th:field="*{password}" maxlength="100"
                    placeholder="Déjalo vacío para conservar la actual">
            </div>

            <div class="admin-form__field">
                <label for="birthDate">Fecha de nacimiento:</label>
                <input type="date" id="birthDate" th:field="*{birthDate}" required>
            </div>

            <div class="admin-form__field">
                <label for="sex">Sexo:</label>
                <select id="sex" th:field="*{sex}" required>
                    <option value="" disabled>Selecciona una opción</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="admin-form__field">
                <label for="role">Rol:</label>
                <select id="role" th:field="*{role.id}" required>
                    <option value="" disabled>Selecciona un rol</option>
                    <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.type}">Role Name</option>
                </select>
            </div>

            <div class="admin-form__field">
                <label for="trainer">Entrenador (opcional):</label>
                <select id="trainer" name="trainerId">
                    <option value="">Sin entrenador</option>
                    <option th:each="trainer : ${trainers}" th:value="${trainer.code}" th:text="${trainer.name}"
                        th:selected="${user.trainer != null and user.trainer.code == trainer.code}">Trainer Name
                    </option>
                </select>
            </div>

            <div class="admin-form__actions">
                <button type="submit">Guardar Cambios</button>
            </div>
            </form>
        </section>
    </main>
</body>

</html>
